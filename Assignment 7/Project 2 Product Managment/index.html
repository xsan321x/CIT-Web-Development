<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Gallery | Assignment 7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-100%); } }
        .animate-marquee { display: inline-block; animation: marquee 30s linear infinite; }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen antialiased">

    <div class="bg-indigo-600 text-white py-2 overflow-hidden whitespace-nowrap border-b border-indigo-700">
        <div class="animate-marquee">
            <span class="mx-8 font-bold uppercase tracking-widest text-xs">Assignment 7 : Project 2 &bull; Product Inventory App &bull;</span>
            <span class="mx-8 font-bold uppercase tracking-widest text-xs">Assignment 7 : Project 2 &bull; Product Inventory App &bull;</span>
            <span class="mx-8 font-bold uppercase tracking-widest text-xs">Assignment 7 : Project 2 &bull; Product Inventory App &bull;</span>
        </div>
    </div>

    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-30 border-b border-slate-200 p-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-black text-slate-800 tracking-tight">STOCK<span class="text-indigo-600">GALLERY</span></h1>
            
            <div class="flex items-center gap-4 w-full md:w-auto">
                <select id="categoryFilter" class="bg-slate-100 border-none rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="">All Categories</option>
                    <option value="electronics">Electronics</option>
                    <option value="jewelery">Jewelery</option>
                    <option value="men's clothing">Men's Clothing</option>
                    <option value="women's clothing">Women's Clothing</option>
                </select>
                <button onclick="toggleModal()" class="bg-slate-900 text-white px-6 py-2 rounded-xl font-bold text-sm hover:bg-indigo-600 transition-all shadow-lg">
                    Add Product
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-10">
        <div id="loader" class="flex flex-col items-center justify-center py-24">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-slate-200 border-t-indigo-600"></div>
            <p class="mt-4 text-slate-400 font-medium tracking-wide">Syncing Gallery...</p>
        </div>

        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            </div>
    </main>

    <div id="productModal" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl overflow-hidden border border-white">
            <div class="p-6 bg-slate-50 border-b border-slate-100">
                <h2 id="modalTitle" class="text-xl font-bold text-slate-800">Product Details</h2>
            </div>
            <form id="productForm" class="p-6 space-y-4">
                <input type="hidden" id="productId">
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase ml-1">Product Title</label>
                    <input type="text" id="pTitle" required class="w-full p-3 bg-slate-100 border-none rounded-xl mt-1 outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase ml-1">Price ($)</label>
                        <input type="number" step="0.01" id="pPrice" required class="w-full p-3 bg-slate-100 border-none rounded-xl mt-1 outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase ml-1">Category</label>
                        <select id="pCategory" required class="w-full p-3 bg-slate-100 border-none rounded-xl mt-1 outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="electronics">Electronics</option>
                            <option value="jewelery">Jewelery</option>
                            <option value="men's clothing">Men's Clothing</option>
                            <option value="women's clothing">Women's Clothing</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase ml-1">Image URL</label>
                    <input type="url" id="pImage" required class="w-full p-3 bg-slate-100 border-none rounded-xl mt-1 outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase ml-1">Description</label>
                    <textarea id="pDesc" rows="3" required class="w-full p-3 bg-slate-100 border-none rounded-xl mt-1 outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-6">
                    <button type="button" onclick="toggleModal()" class="px-6 py-2 text-slate-400 font-bold hover:text-slate-600">Cancel</button>
                    <button type="submit" class="bg-indigo-600 text-white px-8 py-2 rounded-xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
