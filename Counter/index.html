<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style rel="stylesheet" href="style.css"></style>
</head>
<body>
    <div class="counter-wrapper">

      <h1 class="counter-title">Counter</h1>

      <div class="counter-display">
        <span id="counter-value">0</span>
      </div>

      <div class="counter-buttons">
        <button class="btn btn-minus" id="btn-decrement">−</button>
        <button class="btn btn-reset" id="btn-reset">Reset</button>
        <button class="btn btn-plus" id="btn-increment" onclick="addvalue">+</button>
      </div>

    </div>
    <script src="./script.js"></script>
</body>
</html>
